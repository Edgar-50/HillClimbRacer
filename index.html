<!doctypehtml><html lang=en><head><meta charset=utf-8><meta content="width=device-width,initial-scale=1"name=viewport><title>Hill Climb Racer</title><meta content="Physics-driven 2D hill climbing game in C + raylib, with an AI rival, autopilot, ghosts and upgrades."name=description><style>:root{--bg:#0b1030;--accent:#ffd23c;--text:#e8ecff;--muted:#9aa3d6}*{box-sizing:border-box}body,html{margin:0;height:100%;background:radial-gradient(ellipse at top,#26306e 0,var(--bg) 60%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}body{display:flex;flex-direction:column;align-items:center}header{padding:14px 16px 8px;text-align:center}h1{margin:0;font-size:clamp(22px,4vw,34px);letter-spacing:2px;color:var(--accent);text-shadow:0 3px 0 #8a5a00}header p{margin:4px 0 0;color:var(--muted);font-size:14px}#stage{position:relative;width:100%;display:flex;justify-content:center}#wrap{position:relative;width:1400px;height:800px;transform-origin:top left;flex:none;border-radius:14px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 0 2px rgba(255,210,60,.35);background:#000}canvas.emscripten{width:1400px;height:800px;display:block;outline:0}#status{position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;background:#0b1030;font-size:18px}#bar{width:min(60%,420px);height:10px;background:#2a3270;border-radius:6px;overflow:hidden}#fill{height:100%;width:0;background:linear-gradient(90deg,#4cd964,#ffd23c);transition:width .2s}footer{padding:10px 16px 16px;color:var(--muted);font-size:13px;text-align:center}kbd{background:#1c2457;border:1px solid #3a4590;border-bottom-width:3px;border-radius:5px;padding:1px 6px;color:var(--text);font-size:12px}a{color:var(--accent)}</style></head><body><header><h1>HILL CLIMB RACER</h1><p>Race the AI rival, chase your ghost, upgrade your ride. Click the game to focus.</p></header><div id=stage><div id=wrap><canvas class=emscripten id=canvas oncontextmenu=event.
